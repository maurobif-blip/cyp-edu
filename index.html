<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0091D5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CYP EDU">
<meta name="robots" content="noindex,nofollow">
<title>CYP EDU</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--ink:#37352F;--muted:#73726E;--soft:#5A5955;--line:#E9E9E7;--line2:#D3D1CB;--fill:#F7F6F3;--fill2:#F1F1EF;--pri:#1C6FC1;--pri2:#155A9E;--prisoft:#E7F3F8;
--green:#3D6626;--greensoft:#EDF3EC;--yellow:#6B5D00;--yellowsoft:#FBF3DB;--orange:#8A4A12;--orangesoft:#FBECDD;--red:#8E2F27;--redsoft:#FDEBEC;--purple:#6A3A60;--purplesoft:#F6F3F9}
*{box-sizing:border-box}
html,body{margin:0;background:#FFFFFF;color:var(--ink);font:400 14.5px/1.45 -apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Helvetica,Arial,sans-serif}
a{color:var(--pri)}a:hover{color:var(--pri2)}
button,input,select,textarea{font:inherit;color:inherit}
h1{margin:0;font-weight:700;font-size:30px;letter-spacing:-.4px}
h2{margin:0;font-weight:600;font-size:18px}
h3{margin:0;font-weight:600;font-size:16px}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{width:40px;height:auto}
.brand b{display:block;font-weight:600;font-size:17px}
.brand span{font-size:12px;color:var(--muted)}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;background:var(--prisoft);color:var(--pri2);flex:none}
.nav{display:flex;flex-wrap:wrap;gap:2px;padding:0 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#FFFFFF;z-index:5}
.nav a{font-weight:500;font-size:14px;color:var(--muted);text-decoration:none;padding:11px 10px;border-bottom:3px solid transparent;display:inline-flex;align-items:center;gap:6px}
.nav a.on{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.main{max-width:1200px;margin:0 auto;padding:24px 24px 64px;display:flex;flex-direction:column;gap:20px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.sub{font-size:12.5px;color:var(--muted)}
.lead{margin:4px 0 0;color:var(--muted)}
.card{border:1px solid var(--line);border-radius:8px;padding:18px 20px;background:#FFFFFF}
.card.soft{background:#FBFBFA}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:900px){.g3,.g4,.g5,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:13.5px;border-radius:6px;padding:7px 13px;min-height:38px;cursor:pointer;border:1px solid var(--line2);background:#FFFFFF;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--fill)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#FFFFFF}.btn.pri:hover{background:var(--pri2)}
.btn.danger{color:var(--red);border-color:#F0C9C6}
.btn.sm{min-height:30px;padding:4px 10px;font-size:12.5px}
.btn.link{border:0;background:none;color:var(--pri);padding:0;min-height:0}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--fill);border:1px solid var(--line2);border-radius:5px;padding:3px;gap:2px}
.seg button,.seg a{border:0;background:transparent;font-weight:600;font-size:13px;color:var(--muted);padding:6px 11px;border-radius:4px;cursor:pointer;text-decoration:none}
.seg .on{background:var(--ink);color:#FFFFFF}
.chip{display:inline-flex;align-items:center;font-weight:600;font-size:12px;padding:2px 8px;border-radius:4px;white-space:nowrap;background:var(--fill2);color:var(--soft)}
.c-green{background:var(--greensoft);color:var(--green)}.c-yellow{background:var(--yellowsoft);color:var(--yellow)}.c-orange{background:var(--orangesoft);color:var(--orange)}.c-red{background:var(--redsoft);color:var(--red)}.c-blue{background:var(--prisoft);color:var(--pri2)}.c-purple{background:var(--purplesoft);color:var(--purple)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:600;font-size:11.5px;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid #EFEFED;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer}tr.click:hover td{background:#FBFBFA}
.tw{overflow-x:auto}
.big{font-weight:700;font-size:32px;line-height:1}
.bar{display:flex;height:10px;background:var(--fill2);border-radius:4px;overflow:hidden}
.bar>div{height:100%}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:14px;padding:6px 0}
.row span{color:var(--soft)}
.sec{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0 0 8px}
.key{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #EFEFED;font-size:14px}
.it .w{flex:1;min-width:0}.it .w b{display:block;font-weight:600}.it .w span{font-size:12.5px;color:var(--muted)}
.grp{font-weight:700;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:12px 0 2px}
.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600}
.f>span{display:flex;gap:4px}
.in{font-weight:400;font-size:14.5px;color:var(--ink);border:1px solid var(--line2);border-radius:6px;padding:7px 10px;min-height:38px;background:#FFFFFF;width:100%}
textarea.in{min-height:70px;resize:vertical}
.in:focus,.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--pri);outline-offset:1px}
.req{color:var(--red)}
.fs{border:0;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:900px){.fs{grid-template-columns:1fr}}
.fs.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.fs .wide{grid-column:1/-1}
.filters{display:grid;grid-template-columns:2fr repeat(6,minmax(0,1fr));gap:10px;align-items:end}
@media (max-width:900px){.fs.two,.filters{grid-template-columns:1fr}.hd .who{flex-wrap:wrap}.main{padding:16px 16px 48px}.hd,.nav{padding-left:16px;padding-right:16px}}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;font-weight:400;color:var(--ink);font-size:14px}
.checks label{display:inline-flex;gap:6px;align-items:center}
.att{display:inline-flex;gap:4px}
.att button{border:1px solid var(--line2);background:#FFFFFF;border-radius:5px;padding:5px 10px;font-weight:600;font-size:12.5px;cursor:pointer;min-width:74px;color:var(--soft)}
.att button.on.P{background:var(--greensoft);border-color:#B7D3B0;color:var(--green)}
.att button.on.H{background:var(--prisoft);border-color:#A9CBE3;color:var(--pri2)}
.att button.on.A{background:var(--redsoft);border-color:#F0C9C6;color:var(--red)}
.att button.on.S{background:#FBF3DB;border-color:#E9D9A6;color:#7A5C00}
.att button.on.E{background:#F1ECF7;border-color:#D5C6E8;color:#5B3F8C}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:16px;display:flex;flex-direction:column;gap:14px}
.tl .e{position:relative}.tl .e:before{content:'';position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:#FFFFFF;border:2px solid var(--line2)}
.tl .e b{font-weight:600}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.note{background:var(--fill);border-radius:6px;padding:10px 12px;font-size:13.5px;color:var(--soft)}
.warn{background:var(--yellowsoft);color:var(--yellow);border-radius:6px;padding:10px 12px;font-size:13.5px}
.ok{background:var(--greensoft);color:var(--green);border-radius:6px;padding:10px 12px;font-size:13.5px}
.tile{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:#FFFFFF}
.tile b{font-size:24px;font-weight:700;line-height:1}.tile span{font-size:12.5px;color:var(--soft)}
.tile:hover{background:#FBFBFA}
.dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 14px;font-size:14px;margin:0}
.dl dt{color:var(--muted)}.dl dd{margin:0;white-space:pre-wrap;word-break:break-word}
@media (max-width:700px){.dl{grid-template-columns:1fr}.dl dt{margin-top:6px}}
.login{max-width:900px;margin:0 auto;padding:48px 24px;display:flex;flex-direction:column;gap:22px;align-items:center;text-align:center}
.staffgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;width:100%}
.stile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border:1px solid var(--line);border-radius:8px;background:#FFFFFF;cursor:pointer;font-weight:600}
.stile:hover{border-color:var(--pri)}.stile small{font-weight:400;color:var(--muted);font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#FFFFFF;padding:10px 16px;border-radius:6px;font-size:14px;z-index:20;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.foot{max-width:1200px;margin:0 auto;padding:0 24px 32px;font-size:12px;color:var(--muted)}
.hide{display:none!important}
@media print{.nav,.hd .who,.btn,.seg,.foot{display:none!important}.main{padding:0}}
.demobar{background:var(--orangesoft);color:var(--orange);padding:8px 24px;font-size:13.5px;line-height:1.5}.demobar .btn.link{color:var(--orange);text-decoration:underline;font-weight:600;font-size:13.5px}.demobar a{color:var(--orange);font-weight:600}
@media print{.demobar{display:none}}
.tour-hi{position:absolute;z-index:30;border-radius:10px;box-shadow:0 0 0 3px var(--pri),0 0 0 9999px rgba(30,30,30,.38);pointer-events:none;transition:all .15s}
.tour-dot{position:absolute;z-index:32;width:26px;height:26px;border-radius:50%;background:var(--pri);color:#FFFFFF;font-weight:700;font-size:12.5px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 3px #FFFFFF,0 2px 6px rgba(0,0,0,.25)}
.tour-dot.on{background:var(--orange)}
.tour-pop{position:fixed;z-index:33;right:16px;bottom:16px;width:380px;max-width:calc(100vw - 32px);background:#FFFFFF;border-radius:10px;padding:14px 16px;box-shadow:0 10px 32px rgba(0,0,0,.25);font-size:14px;line-height:1.5}
.tour-mini{width:auto;max-width:560px;font-size:13.5px}
@media (max-width:700px){.tour-pop{left:8px;right:8px;bottom:8px;width:auto}}
@media print{.tour-layer{display:none}}
.lwrap{max-height:72vh;overflow:auto;border:1px solid var(--line);border-radius:6px}
.lgrid{border-collapse:separate;border-spacing:0;font-size:12.5px;width:auto}
.lgrid th,.lgrid td{padding:0;border-bottom:1px solid #EFEFED;border-right:1px solid #EFEFED;text-align:center;min-width:26px;height:28px;text-transform:none;letter-spacing:0;font-size:11.5px;vertical-align:middle}
.lgrid thead th{position:sticky;top:0;background:#FFFFFF;z-index:3;padding:3px 0;line-height:1.2}
.lgrid .lname{position:sticky;left:0;background:#FFFFFF;z-index:2;text-align:left;padding:3px 8px;min-width:210px;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400;font-size:13px;color:var(--ink)}
.lgrid thead .lname{z-index:4}
.lgrid td.lc{cursor:pointer;font-weight:700;user-select:none}
.lgrid td.lc:hover{outline:2px solid var(--pri);outline-offset:-2px}
.lc.C{background:var(--greensoft);color:var(--green)}.lc.S{background:var(--orangesoft);color:var(--orange)}
.lgrid .we{background:#FAFAF9}.lgrid .td{box-shadow:inset 2px 0 0 var(--pri),inset -2px 0 0 var(--pri)}
.lgrid .ln{font-variant-numeric:tabular-nums;padding:0 8px;font-weight:600}
.lgrid tfoot td,.lgrid tfoot th{position:sticky;bottom:0;background:var(--fill);font-weight:600;z-index:2}
.lcat{display:inline-block;font-size:10.5px;font-weight:700;border-radius:3px;padding:0 4px;background:var(--fill2);color:var(--soft)}
.lcat.A{background:var(--redsoft);color:var(--red)}.lcat.B{background:var(--prisoft);color:var(--pri2)}
.ltmain th{white-space:normal;font-size:10.5px;min-width:74px}
details summary{list-style:revert}
.guide{padding:14px 16px;display:flex;flex-direction:column}
.guide.mine{box-shadow:0 0 0 2px var(--pri)}
.guide a{display:block;padding:6px 0;border-top:1px solid #EFEFED;font-size:13.5px;text-decoration:none}
.guide a:hover{text-decoration:underline}
.guide a.first{font-weight:600}
.gbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:4px}
.gbtns .btn{min-height:56px;white-space:normal;text-align:center;font-size:14.5px;border-top:1px solid var(--line2);padding:8px 12px}
.guide .gbtns a:hover{text-decoration:none}
details.more>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--pri);padding:6px 0}
.btn.sm{min-height:34px}
.sub{font-size:13px}
.att button{min-height:36px}
.guide .gbtns a{display:flex;align-items:center;justify-content:center;padding:8px 12px;border:1px solid var(--line2)}
.guide .gbtns a.pri{border-color:var(--pri);color:#FFFFFF}
.stafft td{vertical-align:middle}.stafft input[type=checkbox]{width:18px;height:18px}
.grid.g1{grid-template-columns:1fr}

/* visits: section and centre choice */
.vchoose{display:flex;flex-direction:column;gap:14px}
.seg.big a{font-size:14px;padding:9px 14px}
.cbtns{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.cbtn{display:flex;flex-direction:column;gap:2px;padding:10px 14px;border:2px solid var(--line2);border-left:8px solid var(--c);border-radius:8px;text-decoration:none;color:var(--ink);background:#FFFFFF}
.cbtn b{font-size:15px}.cbtn span{font-size:12.5px;color:var(--soft)}
.cbtn:hover{background:#FBFBFA}
.cbtn.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,#FFFFFF);box-shadow:0 0 0 2px var(--c) inset}
.vnow{margin:0;padding:8px 12px;background:var(--fill);border-radius:6px;font-size:13.5px}
.cgrp{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:16px 0 4px;padding:7px 12px;border-left:8px solid var(--c);background:color-mix(in srgb,var(--c) 10%,#FFFFFF);border-radius:4px}
.cgrp b{font-size:15px}.cgrp span{font-size:12.5px;color:var(--soft)}
.cchip{display:inline-block;color:#FFFFFF;font-size:11px;font-weight:700;border-radius:4px;padding:1px 7px;vertical-align:1px}
/* Luigi: three daily sheets */
.tile.lsheet{border-width:2px;border-top:6px solid var(--c)}
.tile.lsheet.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 8%,#FFFFFF)}
.lstaff{margin-top:10px;padding:10px 12px;background:var(--fill);border-radius:6px}
.lstaff .lbl{font-weight:600;font-size:13px;margin-bottom:6px}
.lstaff .checks{align-items:center}
@media (max-width:760px){.cbtns{grid-template-columns:repeat(2,minmax(0,1fr))}}
.it .w span.cchip,.cchip{color:#FFFFFF;font-size:11px}
.tm{font-style:normal;font-weight:700;color:var(--ink)}
@media (max-width:700px){.it{flex-wrap:wrap;justify-content:flex-end}.it .w{flex:1 1 200px}}
tr.gsep td,tr.gsep th{background:var(--fill);font-weight:700;font-size:12px;color:var(--soft);text-transform:uppercase;letter-spacing:.04em;padding:6px 8px;text-align:left}
.lgrid tr.gsep th.lname{background:var(--fill);font-weight:700;font-size:11.5px}.lgrid tr.gsep td{background:var(--fill)}

/* visits: four tabs */
.vtabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.vtabs a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border:2px solid var(--line2);border-radius:8px;background:#FFFFFF;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px}
.vtabs a:hover{background:#FBFBFA}
.vtabs a.on{border-color:var(--ink);background:var(--ink);color:#FFFFFF}
.vtabs .n{font-size:12.5px;font-weight:700;background:var(--fill);color:var(--ink);border-radius:10px;padding:1px 8px}
.vtabs a.on .n{background:#FFFFFF}
@media (max-width:760px){.vtabs{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* To do: one box per section */
.ovcard h2{margin:0}
.ovsum{margin:4px 0 8px;font-size:13px;font-weight:600}.ovsum.ok{color:var(--green)}.ovsum.has{color:var(--soft)}
.al{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;margin-top:6px;border-radius:6px;border-left:5px solid var(--line2);background:var(--fill);color:var(--ink);text-decoration:none;font-size:14px}
.al:hover{filter:brightness(.97)}
.al b{font-size:16px;font-variant-numeric:tabular-nums;min-width:26px;text-align:center}
.al i{font-style:normal;color:var(--muted);font-size:18px}
.al.red{border-left-color:var(--red);background:var(--redsoft)}.al.red b{color:var(--red)}
.al.orange{border-left-color:var(--orange);background:var(--orangesoft)}.al.orange b{color:var(--orange)}
.al.info{background:#FFFFFF;border:1px solid var(--line2);border-left:5px solid var(--line2)}.al.info b{font-size:14px;color:var(--soft)}
details.card.more>summary{cursor:pointer}

/* ====================== phones ====================== */
.mnav,.mfbtn,.mo,.bs,.dshort{display:none}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;align-items:center;gap:10px;padding:14px 14px;border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);background:#FFFFFF}
.mitem>span:first-child{flex:1;display:flex;flex-direction:column}.mitem b{font-size:16px}.mitem small{color:var(--muted);font-size:13px}.mitem i{font-style:normal;color:var(--muted);font-size:20px}
.cpick{display:flex;flex-direction:column;gap:6px}
.cpsel{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--fill)}
.cpsel .w{flex:1;min-width:0}.cpsel .w b{display:block}.cpsel .w span{font-size:12.5px;color:var(--muted);font-weight:400}
.cpres{display:flex;flex-direction:column;gap:4px}
.cpopt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:#FFFFFF;cursor:pointer;min-height:48px}
.cpopt:hover{border-color:var(--pri);background:var(--prisoft)}
.cpopt .w{display:flex;flex-direction:column;min-width:0}.cpopt b{font-weight:600}.cpopt small{color:var(--muted);font-size:12.5px;font-weight:400}
@media (max-width:760px){
  html,body{font-size:15px}
  .demobar{padding:6px 12px;font-size:12.5px;display:flex;align-items:center;gap:6px}.demobar .dlong{display:none}.dshort{display:inline}.demobar .btn{min-height:34px;margin-right:4px!important}
  .hd{padding:8px 12px;flex-wrap:nowrap;gap:8px;position:sticky;top:0;background:#FFFFFF;z-index:6}
  .brand{gap:8px}.brand img{width:30px}.brand b{font-size:16px}.bl,.bsub{display:none}.bs{display:inline}
  .hidem,.who .nm{display:none!important}
  .who{gap:6px}.av{width:32px;height:32px}
  .nav{display:none}
  .mnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:#FFFFFF;border-top:1px solid var(--line2);z-index:8;padding-bottom:env(safe-area-inset-bottom)}
  .mnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function today() { return iso(new Date()); }
function thisMonth() { return today().slice(0, 7); }
function addDays(s, n) { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); }
function daysBetween(a, b) { return Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 864e5); }
function monthStart(m) { return m + '-01'; }
function monthEnd(m) { const [y, mo] = m.split('-').map(Number); return iso(new Date(y, mo, 0)); }
function addMonths(m, n) { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + n, 1); return iso(d).slice(0, 7); }
function inRange(d, a, b) { return !!d && d >= a && d <= b; }
function fmtDate(s) { if (!s) return ''; const d = new Date(s + 'T00:00:00'); if (isNaN(d)) return s; return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }); }
function fmtMonth(m) { const d = new Date(m + '-01T00:00:00'); return d.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' }); }
function quarterOf(m) { const [y, mo] = m.split('-').map(Number); const q = Math.floor((mo - 1) / 3); return { label: 'Q' + (q + 1) + ' ' + y, start: y + '-' + String(q * 3 + 1).padStart(2, '0') + '-01', end: monthEnd(y + '-' + String(q * 3 + 3).padStart(2, '0')) }; }
function uid(p) { return p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function initials(n) { return String(n || '?').replace(/\(.*?\)/g, '').replace(/[^A-Za-z\s'-]/g, '').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase(); }
function titleCase(s) { s = String(s || '').trim(); if (!s) return ''; if (s !== s.toUpperCase()) return s; return s.toLowerCase().replace(/\b([a-z])/g, c => c.toUpperCase()); }
function uniq(a) { return Array.from(new Set(a)); }
function pct(n, d) { return d ? Math.round(n / d * 1000) / 10 : 0; }
function opt(list, val, blank) { return (blank != null ? `<option value="">${esc(blank)}</option>` : '') + list.map(o => { const v = typeof o === 'object' ? o.v : o, l = typeof o === 'object' ? o.l : o; return `<option value="${esc(v)}"${String(v) === String(val ?? '') ? ' selected' : ''}>${esc(l)}</option>`; }).join(''); }
function toast(msg) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2600); }

/* ---------- storage (IndexedDB, fallback memory) ---------- */
const IS_DEMO = typeof DEMO_STATE !== 'undefined';
const DB_NAME = IS_DEMO ? 'cicetekelo-records-demo' : 'cicetekelo-records', DB_STORE = 'kv';
const USER_KEY = IS_DEMO ? 'cyp-demo-user' : 'cyp-user';
/* Demo: the invented data was made for DEMO_BASE; every date moves forward so that the demo always looks current. */
function demoState() {
  const st = JSON.parse(JSON.stringify(DEMO_STATE));
  const shift = Math.max(0, daysBetween(DEMO_BASE, today()));
  const months = (Number(today().slice(0, 4)) - Number(DEMO_BASE.slice(0, 4))) * 12 + Number(today().slice(5, 7)) - Number(DEMO_BASE.slice(5, 7));
  const day = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v) ? addDays(v, shift) : v;
  const walk = o => { if (Array.isArray(o)) return o.map(walk); if (o && typeof o === 'object') { for (const k of Object.keys(o)) o[k] = walk(o[k]); return o; } return day(o); };
  for (const k of ['children', 'visits', 'events', 'moves', 'sessions', 'outreach']) st[k] = walk(st[k]);
  const att = {}; for (const [d, v] of Object.entries(st.attendance)) { const nd = addDays(d, shift); if (nd < today()) att[nd] = v; } st.attendance = att;
  const mk = o => { const n = {}; for (const [m, v] of Object.entries(o || {})) n[addMonths(m, Math.max(0, months))] = walk(v); return n; };
  st.reports = mk(st.reports); st.settings.targets = mk(st.settings.targets);
  for (const p of st.plans || []) p.month = addMonths(p.month, Math.max(0, months));
  st.staff = seedStaff(); st.meta.staffSeed = 2;
  st.meta.demoLoaded = today();
  return st;
}
let storageOk = true;
function idb() {
  return new Promise((res, rej) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => r.result.createObjectStore(DB_STORE);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  });
}
async function loadState() {
  try {
    const db = await idb();
    return await new Promise((res, rej) => { const tx = db.transaction(DB_STORE, 'readonly'); const g = tx.objectStore(DB_STORE).get('state'); g.onsuccess = () => res(g.result || null); g.onerror = () => rej(g.error); });
  } catch (e) { storageOk = false; return null; }
}
let saveTimer = null;
function save() {
  if (GUEST) return;
  stampChanges();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (!storageOk || GUEST) return;
    try {
      const db = await idb();
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(JSON.parse(JSON.stringify(S)), 'state');
    } catch (e) { storageOk = false; render(); }
  }, 150);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { } }

function pendingData() {

  }

  const kids = S.children.filter(c => (c.section === 'UCC' || c.section === 'Youth') && c.residence === 'Resident');
  const grp = c => { const a = curAge(c); if (a === '') return '9 to 18 years'; return a < 9 ? 'Under 9 years' : a <= 18 ? '9 to 18 years' : 'Over 18 years'; };
  const groups = ['Under 9 years', '9 to 18 years', 'Over 18 years'];
  const before = addDays(q.start, -1);
  const cell = (l, sex) => l.filter(c => (c.sex || 'M') === sex).length;
  const rows = groups.map(g => {
    const k = kids.filter(c => grp(c) === g);
    const bf = k.filter(c => inCareOn(c, before) && (!c.entryDate || c.entryDate < q.start));
    const nw = k.filter(c => inRange(c.entryDate, q.start, q.end));
    const ids = new Set(k.map(c => String(c.id)));
    const rel = distinctChildren(movesIn('reintegrated', q.start, q.end).map(x => x.childId).filter(id => ids.has(String(id))));
    const oth = distinctChildren(movesIn('closed', q.start, q.end).map(x => x.childId).filter(id => ids.has(String(id))));
    const handled = uniq(bf.concat(nw));
    const remain = k.filter(c => inCareOn(c, q.end));
    return [g].concat([bf, nw, handled, rel, oth, remain].flatMap(l => [cell(l, 'M'), cell(l, 'F')]));
  });
  const tot = ['Total']; for (let i = 1; i < 13; i++) tot.push(rows.reduce((s, r) => s + r[i], 0));
  rows.push(tot);
  return { q, rows };
}

function route() {
  const h = (location.hash || '#/home').slice(1);
  const [p, qs] = h.split('?');
  const parts = p.split('/').filter(Boolean);
  return { path: parts[0] || 'home', id: parts[1], sub: parts[2], q: new URLSearchParams(qs || '') };
}
function go(h) { location.hash = h; }
function setQuery(changes) {
  const r = route(); for (const [k, v] of Object.entries(changes)) { if (v === '' || v == null) r.q.delete(k); else r.q.set(k, v); }
  const base = '#/' + [r.path, r.id, r.sub].filter(Boolean).join('/'); const s = r.q.toString();
  history.replaceState(null, '', base + (s ? '?' + s : '')); render();
}

function filteredChildren(q) {

    if (st === 'open' && c.status === 'Closed') return false;
    if (st === 'current' && !isCurrent(c)) return false;
    if (STATUSES.includes(st) && c.status !== st) return false;
    if (res && c.residence !== res) return false;
    if (sx && c.sex !== sx) return false;
    if (who && c.responsible !== who) return false;
    if (issue && !(issue === 'dob' ? !c.dob : issuesOf(c).includes(issue))) return false;

    return true;

function moveLabel(m) {
  if (m.type === 'section') return 'Moved from ' + ((SECTIONS[m.from] || {}).label || m.from) + ' to ' + ((SECTIONS[m.to] || {}).label || m.to);
  if (m.type === 'reintegrated') return 'Reintegrated with the family; 2-year follow-up starts';
  if (m.type === 'closed') return 'File closed' + (m.reason ? ': ' + m.reason : '');
  if (m.type === 'reopened') return 'File reopened';
  if (m.type === 'status') return 'Status changed to ' + (STATUS_LABEL[m.to] || m.to);
  if (m.type === 'residence') return 'Now ' + (m.to || '').toLowerCase();
  if (m.type === 'street') return 'Street situation: ' + (m.to ? STREET_CATS[m.to] : 'not on the street any more');
  if (m.type === 'handover') return 'Handed over';
  if (m.type === 'admitted') return 'Admitted';
  return m.type;
}

/* ---------- files to review for closure ---------- */
const RX_STRONG = /(opted to get married|(he|has|is now) (got )?married|a married man|does ?n'?t come to the cent|doesnt come to the cent|no longer (comes|attends|coming)|discharge lett|is a teacher|working as a|currently working|currentyly working|ran away from the cent)/i;
const RX_MEDIUM = /(left the cent|done with school|completed (his )?(grade ?12|school)|stop+ed (school|attending|going|coming))/i;
function reviewSignals(c) {
  if (!(isCurrent(c))) return { score: 0, why: [], strong: false };
  if (c.reviewKeep) return { score: 0, why: [], strong: false };
  const why = []; let score = 0, strong = false;
  const txt = [c.notes, c.objectives].join(' ');
  const ms = txt.match(RX_STRONG), mm = txt.match(RX_MEDIUM);
  if (ms) { strong = true; score += 3; why.push('Notes say: "' + snippet(txt, ms.index) + '"'); }
  else if (mm) { score += 2; why.push('Notes say: "' + snippet(txt, mm.index) + '"'); }
  if (c.entryDate && c.entryDate < '2020-01-01') { score += 1; why.push('In the programme since ' + c.entryDate.slice(0, 4)); }
  const age = curAge(c); if (age !== '' && age >= 21) { score += 1; why.push('Age ' + age); }
  if (c.section === 'UCC' || c.section === 'Youth') {
    const days = Object.keys(S.attendance).filter(d => daysBetween(d, today()) <= 30 && daysBetween(d, today()) >= 0 && Object.keys(S.attendance[d]).some(id => { const k = child(id); return k && k.residence === c.residence; }));
    if (days.length >= 5 && !days.some(d => ['P', 'H'].includes(S.attendance[d][c.id]))) { score += 2; why.push('Not present on any of the ' + days.length + ' attendance days recorded in the last 30 days'); }
  }
  const recent = S.visits.some(v => String(v.childId) === String(c.id) && daysBetween(v.date, today()) < 180) || Object.entries(S.attendance).some(([d, o]) => o[c.id] === 'P' && daysBetween(d, today()) < 60);
  if (recent) return { score: 0, why: [], strong: false };
  if (!strong && score < 2) return { score: 0, why, strong };
  return { score, why, strong };
}
function snippet(s, i) { const a = Math.max(0, i - 40), b = Math.min(s.length, i + 70); return (a ? '…' : '') + s.slice(a, b).trim().toLowerCase() + (b < s.length ? '…' : ''); }
function vReview() {
  const list = S.children.map(c => ({ c, s: reviewSignals(c) })).filter(x => x.s.score > 0).sort((a, b) => b.s.score - a.s.score || (a.c.entryDate || '').localeCompare(b.c.entryDate || ''));
  const actR = S.children.filter(c => isCurrent(c) && (c.section === 'UCC' || c.section === 'Youth') && c.residence === 'Resident').length;
  const actN = S.children.filter(c => isCurrent(c) && (c.section === 'UCC' || c.section === 'Youth') && c.residence !== 'Resident').length;
  return `<div class="top"><div><h1>Files to review</h1><p class="lead">Open files of children and youth who probably left, but whose file was never closed. The Minsundu tool had no way to close a file.</p></div><button class="btn" data-act="xl" data-k="review">Export in Excel</button></div>
  <div class="note">Minsundu, open files now: <b>${actR} residents and ${actN} non-residents</b>. The Q3 2026 report counted 46 residents and 56 non-residents. The difference is mostly files that should be closed.</div>
  ${list.length ? `<form class="card" data-form="bulkclose" style="padding:6px 8px">
    <div class="tw"><table><thead><tr><th><input type="checkbox" data-act="checkall" aria-label="Select all"></th><th>Child</th><th>Section</th><th>Residence</th><th>Why it is listed</th><th></th></tr></thead><tbody>
    ${list.map(x => `<tr><td><input type="checkbox" name="ids" value="${esc(x.c.id)}"${x.s.strong ? ' checked' : ''}></td><td>${childLink(x.c)}<div class="sub">ID ${esc(x.c.id)}${curAge(x.c) !== '' ? ' · ' + esc(curAge(x.c)) + ' years' : ''}</div></td><td>${secChip(x.c.section)}</td><td>${esc(x.c.residence || '')}</td><td>${x.s.why.map(w => `<div>${esc(w)}</div>`).join('')}</td><td><button type="button" class="btn sm" data-act="keepopen" data-id="${esc(x.c.id)}" title="Still in the programme: remove from this list">Still active</button></td></tr>`).join('')}
    </tbody></table></div>
    <div class="fs" style="grid-template-columns:1fr 1fr 2fr;padding:14px 10px 6px">${field('Reason', 'reason', '', 'select', { options: opt(CLOSE_REASONS, 'Left the programme, no longer comes') })}${field('Closing date', 'date', today(), 'date', { req: true })}${field('Note', 'note', 'Closed during the review of old records: left the programme before this app was used.')}</div>
    <div style="padding:6px 10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn pri">Close the selected files</button><span class="sub">Ticked already: the files where the notes say clearly that the youth left. Check the others with the section before ticking them. A closed file can be reopened at any time.</span></div>
  </form>` : '<div class="ok">No open file looks inactive.</div>'}`;

const XL = {
  visits() { const q = route().q; downloadXlsx('visits-' + (q.get('m') || thisMonth()), [{ name: 'Visits', rows: colsToRows(filteredVisits(q), VISIT_COLS) }]); },
  attday() { const q = route().q, d = q.get('d') || today(), day = S.attendance[d] || {}; const L = { P: 'Present', H: 'Home leave', A: 'Absent', S: 'Sick', E: 'Permission' }; downloadXlsx('attendance-' + d, [{ name: d, rows: colsToRows(attKids(q), [{ key: 'id', label: 'ID' }, { label: 'Name', get: c => fullName(c) }, { key: 'nickname', label: 'Nickname' }, { label: 'Section', get: c => SECTIONS[c.section].label }, { key: 'residence', label: 'Residence' }, { label: 'Sleeps', get: c => sleepsText(c) }, { label: d, get: c => L[day[attKey(c, q.get('c') || defCentre())]] || '' }]) }]); },
  paths() { const q = route().q, x = pathSel(q), rows = pathRows(q); downloadXlsx('register-' + x.sec + '-' + x.y, [{ name: 'Register', rows: [PATH_COLS.map(c => c.label)].concat(rows.map((r, i) => PATH_COLS.map(c => c.get(r, i)))) }]); },
  attmonth() {
    const q = route().q, d = q.get('d') || today(), m = d.slice(0, 7), n = Number(monthEnd(m).slice(8));
    const q2 = new URLSearchParams(q.toString()); q2.delete('only');

      luigiId: u.id, importedFrom: 'Luigi tool (database of ' + asOf + ')'

/* ---------- is this child already known? ---------- */
function lev(a, b) { const m = a.length, n = b.length; if (Math.abs(m - n) > 2) return 9; let prev = Array.from({ length: n + 1 }, (_, k) => k); for (let i = 1; i <= m; i++) { const cur = [i]; for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = cur; } return prev[n]; }

function knownMatches(text, skipId) {
  const toks = String(text || '').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(w => w.length >= 2);
  if (!toks.length || toks.join('').length < 3) return null;
  const out = [];
  for (const c of S.children) {
    if (skipId && String(c.id) === String(skipId)) continue;
    const words = [c.name, c.surname, c.nickname].join(' ').toLowerCase().replace(/[^a-z ]/g, ' ').split(/\s+/).filter(Boolean);
    let score = 0, ok = true;
    for (const t of toks) { if (words.some(w => w === t)) score += 3; else if (words.some(w => w.startsWith(t))) score += 2; else if (t.length >= 4 && words.some(w => lev1(w, t) || (w.length > 4 && lev1(w.slice(0, t.length), t)))) score += 1; else { ok = false; break; } }
    if (ok) out.push({ c, score });
  }
  return out.sort((x, y) => y.score - x.score || fullName(x.c).localeCompare(fullName(y.c))).slice(0, 8).map(x => x.c);
}
function lastMet(c) {

  for (const [day, v] of Object.entries(S.attendance)) if (day > d && v && v[c.id] === 'P') { d = day; what = centreOf(c) + ' attendance'; }
  for (const v of S.visits) if (String(v.childId) === String(c.id) && v.date > d && v.successful !== 'No') { d = v.date; what = v.purpose + ' visit'; }

}

/* ================= Monthly plan of home visits, Luigi family steps, "where to go" by centre ================= */

function myCentre() { const a = USER ? staffAreas(USER) : [], c = CENTRES.filter(k => a.includes(k)); return c.length === 1 && !a.includes('Admin') && !a.includes('Sports') ? c[0] : ''; }

function planTeam(p) { if (TEAM_KEYS.includes(p.team)) return p.team; const c = child(p.childId); return c && c.section === 'Luigi' ? 'Luigi' : 'Family'; }
function centreChip(c) { const k = centreOf(c); return k ? `<span class="cchip" style="background:${CENTRE_COLOR[k]}">${esc(k)}</span>` : ''; }

function staffAreas(s) {

  const a = []; if (s.admin) a.push('Admin'); if (LEGACY_AREA[s.section]) a.push(LEGACY_AREA[s.section]); return a;

function areasText(s) { const a = staffAreas(s); return a.length ? STAFF_FLAGS.filter(([k]) => a.includes(k)).map(([k, l]) => k === 'Admin' ? 'Education admin' : k === 'Sports' ? 'Sports' : l).join(' · ') : 'No area set'; }

  for (const x of seedStaff()) {
    let s = S.staff.find(y => y.id === x.id) || S.staff.find(y => y.name.toLowerCase() === x.name.toLowerCase());
    if (!s) { S.staff.push(x); continue; }
    if (!Array.isArray(s.areas)) { const wasAdmin = !!s.admin; s.name = x.name; s.role = x.role; s.areas = x.areas.slice(); if (wasAdmin && !s.areas.includes('Admin')) s.areas.unshift('Admin'); s.admin = s.areas.includes('Admin'); s.section = s.areas[0] || 'Other'; if (x.active === false) s.active = false; }
  }
  for (const s of S.staff) if (!Array.isArray(s.areas)) { s.areas = staffAreas(s); s.role = s.role || ''; }
  S.meta.staffSeed = 2; return true;
}

/* ---------- one child, one file: joining two records of the same child ---------- */
function rawChild(id) { id = String(id); return S.children.find(c => String(c.id) === id); }
function mergeChildren(keepId, dropId) {
  keepId = String(keepId); dropId = String(dropId);
  const keep = rawChild(keepId), drop = rawChild(dropId);
  if (!keep || !drop || keep === drop) return false;
  const sw = x => String(x) === dropId ? keepId : x;
  for (const k of Object.keys(drop)) { if (k === 'id' || k === 'sameAs') continue; const e = keep[k] === '' || keep[k] == null || (Array.isArray(keep[k]) && !keep[k].length); if (e && drop[k] !== '' && drop[k] != null) keep[k] = drop[k]; }
  for (const v of S.visits) v.childId = sw(v.childId);
  for (const e of S.events) e.childId = sw(e.childId);
  for (const m of S.moves) m.childId = sw(m.childId);
  for (const s of S.sessions) if (s.children) s.children = uniq(s.children.map(sw).map(String));
  for (const o of S.outreach) if (o.children) o.children = uniq(o.children.map(sw).map(String));
  for (const p of (S.plans || [])) if (p.childId != null) p.childId = sw(p.childId);
  for (const d of Object.keys(S.attendance)) { const day = S.attendance[d]; if (!day) continue; for (const k of Object.keys(day)) if (k === String(dropId) || k.startsWith(dropId + '@')) { const nk = keepId + k.slice(String(dropId).length); if (day[nk] == null) day[nk] = day[k]; delete day[k]; } }
  if (S.photos && S.photos[dropId]) { if (!S.photos[keepId]) S.photos[keepId] = S.photos[dropId]; delete S.photos[dropId]; }
  if (String(keep.sameAs) === dropId) keep.sameAs = '';
  for (const x of S.children) if (x !== keep && String(x.sameAs) === dropId) x.sameAs = keepId;
  S.children.splice(S.children.indexOf(drop), 1);
  S.aliases = S.aliases || {};
  for (const k of Object.keys(S.aliases)) if (S.aliases[k] === dropId) S.aliases[k] = keepId;
  S.aliases[dropId] = keepId;
  return true;
}

/* ---------- absences: a short alert, and a long absence that asks to review the status ---------- */
function absSet() { const s = S.settings.absence || {}; return { alert: Number(s.alert) > 0 ? Number(s.alert) : 4, review: Number(s.review) > 0 ? Number(s.review) : 60 }; }
function absenceList() {
  const A = absSet(), t = today(), dates = Object.keys(S.attendance).sort().reverse(), out = [];
  for (const c of S.children) {
    if (!isCurrent(c)) continue;
    for (const centre of attCentres(c)) {
      if (centre === 'Luigi') continue;
      const key = attKey(c, centre); let run = 0, since = '';
      for (const d of dates) { if (d > t) continue; const s = (S.attendance[d] || {})[key]; if (s == null) continue; if (s === 'A') { run++; since = d; } else if (s === 'S' || s === 'E') continue; else break; }
      if (!run) continue;
      const days = daysBetween(since, t);
      if (days >= A.review) out.push({ c, centre, run, since, days, long: true }); else if (run >= A.alert) out.push({ c, centre, run, since, days, long: false });
    }
  }
  return out.sort((x, y) => y.days - x.days);
}
function absChip(c) { const x = absenceList().find(y => y.c === c); return x ? `<span class="chip ${x.long ? 'c-red' : 'c-orange'}">${x.long ? 'Not coming for ' + x.days + ' days: check the status' : 'Absent ' + x.run + ' days in a row'}</span>` : ''; }

/* ---------- photos from files: the file name is the name of the child ---------- */
function photoCands(fileName) {
  const base = String(fileName).replace(/\.[a-z0-9]+$/i, '').replace(/\d+\s*(yrs?|years?)?/gi, ' ').replace(/copy|img|photo/gi, ' ');
  const words = nameKey(base).split(' ').filter(Boolean); if (!words.length) return { exact: [], near: [] };
  const exact = [], near = [];
  for (const c of S.children) {
    const cw = nameKey(fullName(c)).split(' ').filter(Boolean); if (!cw.length) continue;
    const common = words.filter(w => cw.includes(w)).length;
    if (common === words.length && common === cw.length) exact.push(c);
    else if (common >= 2 || (common === 1 && words.length === 1)) near.push({ c, common });
    else if (common === Math.min(words.length, cw.length) && common >= 1 && Math.min(words.length, cw.length) >= 2) near.push({ c, common });
  }
  near.sort((x, y) => y.common - x.common || (y.c.status !== 'Closed') - (x.c.status !== 'Closed'));
  return { exact, near: near.slice(0, 8).map(x => x.c) };
}
function photoSmall(file) {
  return new Promise(res => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, 280 / Math.max(img.width, img.height)), cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k); cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url); res(cv.toDataURL('image/jpeg', 0.7)); };
    img.onerror = () => { URL.revokeObjectURL(url); res(''); }; img.src = url; });
}
function photosBatchHtml() {
  const B = UI.photoBatch || []; if (!B.length) return '';
  const lab = c => `${fullName(c)} · ${(SECTIONS[c.section] || {}).label || c.section} · ID ${c.id}${c.status === 'Closed' ? ' · closed' : ''}${photos()[c.id] ? ' · has a photo, it will be replaced' : ''}`;
  const n = B.filter(x => x.pick).length;
  return `<div class="tw"><table><thead><tr><th>Picture</th><th>File</th><th>Child</th></tr></thead><tbody>${B.map((x, i) => `<tr><td>${x.src ? `<img src="${x.src}" alt="" style="width:56px;height:56px;border-radius:8px;object-fit:cover">` : 'Could not read'}</td><td>${esc(x.name)}</td><td>${x.src ? `<select class="in" data-photopick="${i}"><option value="">Do not add</option>${x.cands.map(c => `<option value="${esc(c.id)}"${String(x.pick) === String(c.id) ? ' selected' : ''}>${esc(lab(c))}</option>`).join('')}</select>${x.cands.length ? (x.sure ? '' : '<div class="sub">Not sure: choose the child, or leave "Do not add".</div>') : '<div class="sub">No child with this name.</div>'}` : ''}</td></tr>`).join('')}</tbody></table></div>
  <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap"><button class="btn pri" data-act="photossave"${n ? '' : ' disabled'}>Save ${n} ${n === 1 ? 'photo' : 'photos'}</button><span class="sub">${B.length} files chosen</span></div>`;
}
async function photosBatchLoad(files) {
  const msg = $('#photosmsg'); if (msg) msg.innerHTML = '<p class="sub">Reading the pictures...</p>';
  const B = [];
  for (const f of files) { const src = await photoSmall(f), k = photoCands(f.name), sure = k.exact.length === 1; B.push({ name: f.name, src, cands: k.exact.concat(k.near.filter(c => !k.exact.includes(c))), sure, pick: sure ? k.exact[0].id : '' }); }

/* ====================================================================
   One shared database for every phone and computer.
   Each device keeps its own copy so that it works without a connection.
   What is recorded is sent by itself to the shared database, and what the
   others recorded arrives by itself. No file to export.
   ==================================================================== */
var _NOSTAMP = false, _SNAP = null, _ASNAP = null;
const SYNC_KEYS = ['visits', 'sessions', 'events', 'moves', 'plans', 'feedback'];
function noStamp() { _NOSTAMP = true; setTimeout(() => { snapChildren(); _NOSTAMP = false; }, 0); }
function childSig(c) { const t = c.updatedTs; c.updatedTs = undefined; const s = JSON.stringify(c); c.updatedTs = t; return s; }
function adminSig() { return JSON.stringify([S.staff, S.settings, S.reports]); }
function snapChildren() { _SNAP = {}; for (const c of S.children) _SNAP[c.id] = childSig(c); _ASNAP = adminSig(); }
function syncMeta() {
  const m = S.meta.sync = S.meta.sync || {};
  for (const k of ['att', 'sheets', 'photos', 'kids', 'newKids', 'rmPlans', 'done']) m[k] = m[k] || {};
  return m;
}
function touchAtt(d, id) { if (!GUEST) syncMeta().att[d + '|' + id] = Date.now(); }
function touchSheet(d, type) { const m = syncMeta(), k = d + '|' + type; let e = m.sheets[k]; if (!e || typeof e !== 'object') e = m.sheets[k] = { ch: {}, full: e ? 1 : 0 }; e.ts = Date.now(); return e; }
function touchDone(kind, id) { if (!GUEST) syncMeta().done[kind + '|' + id] = Date.now(); }
function stampChanges() {
  if (GUEST || _NOSTAMP || !S || !S.children) return;
  if (!_SNAP) { snapChildren(); return; }
  const now = Date.now(), m = syncMeta();
  for (const c of S.children) {
    if (_SNAP[c.id] === undefined && !c.uid) { c.uid = uid('k'); m.newKids[c.uid] = 1; }
    const s = childSig(c);
    if (_SNAP[c.id] !== s) { c.updatedTs = now; _SNAP[c.id] = s; m.kids[c.id] = now; }
  }
  const a = adminSig(); if (a !== _ASNAP) { _ASNAP = a; S.meta.adminTs = now; m.adminDirty = now; }
  m.dirtyAt = now;
  schedulePush();
}
function devId() { let d = lsGet('cyp-dev'); if (!d) { d = Math.random().toString(36).slice(2, 8).toUpperCase(); lsSet('cyp-dev', d); } return d; }

/* what was recorded on this device and is not in the shared database yet */
function buildChanges() {
  const m = syncMeta(), base = m.base || {};
  const f = { format: 'cyp-edu-changes', version: 2, app: VERSION, from: USER ? USER.name : '', device: devId(), created: new Date().toISOString() };
  for (const k of SYNC_KEYS) { const have = new Set(base[k] || []); f[k] = (S[k] || []).filter(x => !have.has(x.id)); }
  f.attendance = {}; let nAtt = 0;
  for (const key of Object.keys(m.att)) { const i = key.indexOf('|'), d = key.slice(0, i), id = key.slice(i + 1), v = (S.attendance[d] || {})[id]; (f.attendance[d] = f.attendance[d] || {})[id] = v == null ? '' : v; nAtt++; }
  f.sheets = [];
  for (const key of Object.keys(m.sheets)) { const i = key.indexOf('|'), d = key.slice(0, i), t = key.slice(i + 1), e = typeof m.sheets[key] === 'object' ? m.sheets[key] : { ch: {}, full: 1 };
    const s = S.outreach.find(x => x.date === d && x.type === t), out = { date: d, type: t, on: [], off: [] };
    if (e.full) out.on = s ? (s.children || []).map(String) : []; else for (const [id, v] of Object.entries(e.ch || {})) (v ? out.on : out.off).push(id);
    if (e.staff || e.full) out.staffIds = s ? (s.staffIds || []) : [];
    if (e.notes || e.full) out.notes = s ? s.notes || '' : '';
    if (e.findings || e.full) out.findings = s ? s.findings || '' : '';
    f.sheets.push(out); }
  f.children = S.children.filter(c => m.kids[c.id]);
  f.newKids = f.children.filter(c => c.uid && m.newKids[c.uid]).map(c => c.uid);
  f.photos = {}; for (const id of Object.keys(m.photos)) if (photos()[id]) f.photos[id] = photos()[id];
  f.plansRemoved = Object.keys(m.rmPlans);
  f.done = Object.keys(m.done);
  if (m.adminDirty) f.admin = { ts: S.meta.adminTs || m.adminDirty, staff: S.staff, settings: S.settings, reports: S.reports };
  f.count = { children: f.children.length, attendance: nAtt, sheets: f.sheets.length, visits: f.visits.length, sessions: f.sessions.length, events: f.events.length, moves: f.moves.length, plans: f.plans.length + f.plansRemoved.length, other: Object.keys(f.photos).length + f.done.length + (f.admin ? 1 : 0) + (f.feedback || []).length };
  f.empty = !Object.values(f.count).some(Boolean);
  return f;
}
function ackChanges(f, mark) {
  const m = syncMeta(); m.base = m.base || {};
  for (const k of SYNC_KEYS) { const set = new Set(m.base[k] || []); for (const x of f[k] || []) set.add(x.id); m.base[k] = Array.from(set); }
  const clear = (o, ts) => { for (const k of Object.keys(o)) if ((ts ? ts(o[k]) : o[k]) <= mark) delete o[k]; };
  clear(m.att); clear(m.sheets, e => (e && e.ts) || 0); clear(m.photos); clear(m.kids); clear(m.rmPlans); clear(m.done);
  for (const u of f.newKids || []) delete m.newKids[u];
  if (m.adminDirty && m.adminDirty <= mark) m.adminDirty = 0;
  m.sentAt = Date.now();
}
function countText(c) { const p = []; const add = (n, s, pl) => { if (n) p.push(n + ' ' + (n === 1 ? s : pl)); };
  add(c.attendance, 'attendance mark', 'attendance marks'); add(c.sheets, 'Luigi sheet', 'Luigi sheets'); add(c.visits, 'visit', 'visits'); add(c.sessions, 'counseling session', 'counseling sessions'); add(c.children, 'child file new or changed', 'child files new or changed'); add(c.events, 'event', 'events'); add(c.moves, 'change of status or section', 'changes of status or section'); add(c.plans, 'change in the plan of visits', 'changes in the plan of visits'); add(c.other, 'other change', 'other changes');
  return p.join(', '); }

/* a child gets another ID: everything recorded for that child follows */
function renameChild(oldId, newId) {
  oldId = String(oldId); newId = String(newId); if (oldId === newId) return;
  const c = child(oldId); if (!c) return; c.id = newId;
  const fx = x => String(x) === oldId ? newId : x;
  for (const k of ['visits', 'events', 'moves', 'plans']) for (const x of S[k] || []) if (String(x.childId) === oldId) x.childId = newId;
  for (const x of S.sessions || []) if (x.children) x.children = x.children.map(fx);
  for (const x of S.outreach || []) if (x.children) x.children = x.children.map(fx);
  for (const d of Object.keys(S.attendance || {})) for (const k of Object.keys(S.attendance[d])) if (k === String(oldId) || k.startsWith(oldId + '@')) { S.attendance[d][newId + k.slice(String(oldId).length)] = S.attendance[d][k]; delete S.attendance[d][k]; }
  if (photos()[oldId]) { photos()[newId] = photos()[oldId]; delete photos()[oldId]; }
  for (const x of S.children) if (String(x.sameAs) === oldId) x.sameAs = newId;
  const m = syncMeta(); for (const o of [m.kids, m.photos]) if (o[oldId] != null) { o[newId] = o[oldId]; delete o[oldId]; }
  for (const key of Object.keys(m.att)) if (key.endsWith('|' + oldId)) { m.att[key.slice(0, key.length - oldId.length) + newId] = m.att[key]; delete m.att[key]; }
  for (const e of Object.values(m.sheets)) if (e && e.ch && e.ch[oldId] != null) { e.ch[newId] = e.ch[oldId]; delete e.ch[oldId]; }
  if (_SNAP && _SNAP[oldId] !== undefined) { delete _SNAP[oldId]; _SNAP[newId] = childSig(c); }
}

/* add what another device recorded */
function mergeIncoming(inc, opt) {
  opt = opt || {};
  if (!inc || (inc.format !== 'cyp-edu-changes' && inc.format !== 'cicetekelo-phone-file')) throw new Error('this is not a file of changes made by this app');
  const out = { from: inc.from || '', children: 0, updated: 0, att: 0, sheets: 0, visits: 0, sessions: 0, events: 0, moves: 0, plans: 0, photos: 0, renum: [] };
  const m = syncMeta(); m.base = m.base || {};
  const asg = inc.idAssign || {}, idMap = {}, byUid = {}; for (const c of S.children) if (c.uid) byUid[c.uid] = c;
  const mapId = id => idMap[String(id)] || String(id);
  const moveAway = id => { const x = child(id); if (x) { const nid = nextChildId(); renameChild(x.id, nid); if (x.uid) m.newKids[x.uid] = 1; m.kids[nid] = Date.now(); } };
  for (const [u, fid] of Object.entries(asg)) { const mine = byUid[u]; if (mine && String(mine.id) !== String(fid)) { const other = child(fid); if (other && other !== mine) moveAway(fid); renameChild(mine.id, fid); } }
  for (const ic of inc.children || []) {
    let target = ic.uid && asg[ic.uid] ? String(asg[ic.uid]) : String(ic.id);

  return `<div class="login">

    <div>${logoSvg(46)}<p class="lead" style="margin-top:10px">Cicetekelo Youth Project · Education Department</p></div>
    ${cfg ? `<div class="card" style="width:100%;max-width:420px">${UI.syncMsg ? `<div class="warn" style="margin:0 0 10px">${UI.syncMsg}</div>` : ''}${st && !st.ok ? `<p class="sub">The shared database does not answer. Check the connection of this ${isPhone() ? 'phone' : 'computer'}.</p><button class="btn pri" data-wact="retry" style="width:100%">Try again</button>` : st && st.ok && !st.hasSnapshot ? `<p class="sub">The shared database is still empty. An Education admin starts it once, from the computer where the records are today.</p><button class="btn" data-wact="retry" style="width:100%">Try again</button>` : '<p class="sub" style="margin:0"><b>Loading the records…</b><br>The first time this takes about a minute. Keep this page open.</p>'}</div>`
      : `<form class="card" data-form="synclink" style="width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px"><p class="sub" style="margin:0">Open the link you received from the Education Department. If you are here without it, paste it below.</p><label class="f"><span>Link</span><input class="in" name="link" autocomplete="off" required></label><button class="btn pri">Open</button></form>`}
    <p class="sub" style="max-width:420px">The names of the children are on this ${isPhone() ? 'phone' : 'computer'} only after the link is opened and the staff PIN is typed.</p>
  </div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-wact]'); if (!b) return;
  const act = b.dataset.wact;
  if (act === 'install' && _installEvt) { _installEvt.prompt(); try { await _installEvt.userChoice; } catch (x) {} _installEvt = null; render(); }
  else if (act === 'retry') { UI.syncPing = null; UI.syncMsg = ''; render(); syncAuto(); }
  else if (act === 'copylink') { const t = staffLink(appUrl()); try { await navigator.clipboard.writeText(t); toast('Link copied'); } catch (x) { const i = document.getElementById('stafflink'); if (i) { i.select(); document.execCommand('copy'); toast('Link copied'); } } }
  else if (act === 'sharelink') { try { await navigator.share({ title: 'CYP EDU', text: 'CYP EDU, the records of the Education Department. Open this link once with a connection, then it also opens without.', url: staffLink(appUrl()) }); } catch (x) {} }
});
FORMS.appurl = function (o) { const u = String(o.appUrl || '').trim(); if (u && !/^https:\/\//.test(u)) return toast('The address must start with https://'); S.settings.appUrl = u; save(); toast('Saved'); render(); };
function staffLinkCard() {
  if (!USER.admin || !syncOn()) return '';
  const url = appUrl(), link = staffLink(url);
  return `<section class="card"><h2>Link for the phones of the staff</h2>
    ${link ? `<p class="sub" style="margin:4px 0 10px">Send this link to each member of staff. Opened once with a connection, the app stays on the phone and opens also without a connection. Whoever has the link and the PIN sees the records: send it only to the staff.</p>
      <input class="in" id="stafflink" readonly value="${esc(link)}" onclick="this.select()">
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn pri" data-wact="copylink">Copy the link</button>${navigator.share ? '<button class="btn" data-wact="sharelink">Send it</button>' : ''}</div>`
      : `<p class="sub" style="margin:4px 0 10px">The app needs a web address, so that the phones can install it and open it without a connection. Write it here once it exists.</p>`}
    ${IS_WEB ? '' : `<form data-form="appurl" style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end;margin-top:12px"><label class="f"><span>Web address of the app</span><input class="in" name="appUrl" value="${esc(S.settings.appUrl || '')}" placeholder="https://..."></label><button class="btn">Save</button></form>`}</section>`;
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); _installEvt = e; const c = document.getElementById('installcard'); if (c) c.outerHTML = installCard(); });
window.addEventListener('appinstalled', () => { _installEvt = null; if (USER) render(); });
if (IS_WEB && 'serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
    navigator.serviceWorker.ready.then(() => { UI.offlineReady = true; if (USER && route().path === 'sync') render(); }).catch(() => {});
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
}

/* the CYP EDU wordmark: CYP in the blue of the project, EDU in a chitenge zig-zag with the colours of the Zambian flag */
function logoSvg(h) {
  const wd = Math.round(h * 953 / 200);
  return `<svg class="cyplogo" role="img" aria-label="CYP EDU" viewBox="0 0 953 200" width="${wd}" height="${h}"><defs><pattern id="cyl-chit" patternUnits="userSpaceOnUse" width="48" height="72"><rect width="48" height="72" fill="#198A00"/><polygon points="0,-18 24,-38 48,-18 48,0 24,-20 0,0" fill="#EF7D00"/><polygon points="0,0 24,-20 48,0 48,18 24,-2 0,18" fill="#198A00"/><polygon points="0,18 24,-2 48,18 48,36 24,16 0,36" fill="#DE2010"/><polygon points="0,36 24,16 48,36 48,54 24,34 0,54" fill="#111111"/><polygon points="0,54 24,34 48,54 48,72 24,52 0,72" fill="#EF7D00"/><polygon points="0,72 24,52 48,72 48,90 24,70 0,90" fill="#198A00"/></pattern><clipPath id="cyl-cap"><rect width="953" height="200"/></clipPath></defs><g clip-path="url(#cyl-cap)" fill="none" stroke-width="46"><g stroke="#0091D5"><path d="M127,52 C110,30 95,23 80,23 C45,23 23,55 23,100 C23,145 45,177 80,177 C95,177 110,170 127,148"/><path d="M155,-10 L228,105 L301,-10"/><path d="M228,105 L228,200"/><path d="M345,200 L345,23 L397,23 C427,23 444,40 444,66 C444,92 427,109 397,109 L345,109"/></g><g stroke="url(#cyl-chit)"><path d="M621,23 L534,23 L534,177 L621,177"/><path d="M534,100 L606,100"/><path d="M660,23 L702,23 C742,23 764,55 764,100 C764,145 742,177 702,177 L660,177 Z"/><path d="M826,0 L826,115 C826,155 848,177 878,177 C908,177 930,155 930,115 L930,0"/></g></g></svg>`;
}

</script>
</body>
